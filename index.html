<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Gothic Remake Lockpick Solver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1 class="app-title">Gothic Remake<br><span class="app-title-accent">Lockpick Solver</span></h1>
  </header>

  <!-- Widoczne tylko na telefonie: przełącznik Starting position / Moveset -->
  <nav class="mobile-switch" id="mobileSwitch" aria-label="Przełącznik paneli">
    <button type="button" class="mobile-switch-option is-active" data-target="starting">Starting position</button>
    <button type="button" class="mobile-switch-track" id="mobileSwitchTrack" aria-hidden="true"><span class="mobile-switch-thumb"></span></button>
    <button type="button" class="mobile-switch-option" data-target="moveset">Moveset</button>
  </nav>

  <main class="layout">

    <!-- ===================== STARTING POSITION ===================== -->
    <section id="startingPanel" class="panel panel-starting is-active-mobile">
      <h2 class="panel-title">Starting position</h2>

      <div class="control-group">
        <div class="control-label-row">
          <label for="blockCountSlider" class="control-label">Number of blocks</label>
          <span class="control-value" id="blockCountValue">6</span>
        </div>
        <div class="slider-row">
          <span class="slider-bound">4</span>
          <input type="range" id="blockCountSlider" class="slider" min="4" max="7" step="1" value="6">
          <span class="slider-bound">7</span>
        </div>
      </div>

      <div class="pin-grid-wrap">
        <div id="pinGrid" class="pin-grid"></div>
      </div>

      <div class="solve-row">
        <button type="button" id="solveBtn" class="btn btn-solve">SOLVE</button>
        <span id="solveWarning" class="solve-warning" hidden>Select all blocks first</span>
      </div>
    </section>

    <!-- ===================== MOVESET ===================== -->
    <section id="movesetPanel" class="panel panel-moveset">
      <h2 class="panel-title">Moveset <span class="panel-subtitle">technical table</span></h2>

      <p id="movesetWarning" class="moveset-warning" hidden></p>

      <div class="table-wrap">
        <table id="movesetTable" class="moveset-table"></table>
      </div>
    </section>

    <!-- ===================== SOLUTION ===================== -->
    <section class="panel panel-solution">
      <div class="solution-header">
        <h2 class="panel-title">Solution</h2>
        <div id="modeSwitch" class="mode-switch" hidden>
          <span class="mode-switch-label" data-mode-label="blocks">Blocks</span>
          <button type="button" id="modeToggle" class="mode-toggle" data-mode="blocks" aria-label="Przełącz tryb Blocks / Arrows">
            <span class="mode-toggle-thumb"></span>
          </button>
          <span class="mode-switch-label" data-mode-label="arrows">Arrows</span>
        </div>
      </div>

      <div id="solutionContent" class="solution-content">
        <p class="solution-placeholder">Enter data and press solve</p>
      </div>

      <div id="solutionActions" class="solution-actions" hidden>
        <button type="button" id="copyBtn" class="btn btn-secondary">COPY</button>
        <button type="button" id="resetBtn" class="btn btn-secondary">RESET</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
